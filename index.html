<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gyro Bouncer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <div id="loading-screen" class="ui-panel">
                <p>Loading your profile...</p>
            </div>
            <div id="start-screen" class="ui-panel hidden">
                <h1>Gyro Bouncer</h1>
                <p>Tilt your device to move the robot.</p>
                <button id="start-button">Tap to Start</button>
                <p class="permission-info">You may need to grant motion sensor permissions.</p>
            </div>
            <div id="game-over-screen" class="ui-panel hidden">
                <h1>Game Over</h1>
                <div id="replay-container">
                    <canvas id="replay-canvas"></canvas>
                    <button id="download-replay-button" title="Download Replay">⬇️</button>
                </div>
                <p>Score: <span id="final-score">0</span></p>
                <p>High Score: <span id="high-score">0</span></p>
                <button id="restart-button">Restart</button>
            </div>
            <div id="score-display" class="hidden">Score: <span id="score">0</span></div>
        </div>
    </div>
    <div id="renderer-container" class="hidden"></div>
    <script src="/websim/websim-socket.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1?dev",
            "react-dom": "https://esm.sh/react-dom@18.3.1?dev",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?dev",
            "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime?dev",
            "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime?dev",
            "remotion": "https://esm.sh/remotion@4.0.350?external=react,react-dom&dev",
            "@remotion/player": "https://esm.sh/@remotion/player@4.0.350?external=react,react-dom&dev",
            "@websim/remotion/player": "https://esm.websim.com/@websim/remotion/player",
            "three": "https://esm.sh/three",
            "nipplejs": "https://esm.sh/nipplejs"
        }
    }
    </script>
    <script type="module" src="main.js"></script>

</body>
</html>
